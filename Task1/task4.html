<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 — Table & Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="navbar">
        <a href="index.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="task3/index.html">Task 3</a>
        <a href="task4.html" class="active">Task 4</a>
        <a href="task5.html">Task 5</a>
    </div>

    <div class="container">
        
        <h1 id="table-heading">Student Academic Performance</h1>

        <table class="grades-table">
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Subject</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Vyacheslav Borovikov</td>
                    <td>Web Technologies</td>
                    <td>95</td>
                </tr>
                <tr class="highlight-row">
                    <td>Danil Golubenko</td>
                    <td>Game Development</td>
                    <td>100</td>
                </tr>
                <tr>
                    <td>Fedorov Kirill</td>
                    <td>Database Systems</td>
                    <td>88</td>
                </tr>
                <tr>
                    <td colspan="2">Average Grade</td>
                    <td>94.3</td>
                </tr>
            </tbody>
        </table>

        <div class="form-container">
            <h2>Feedback & Support Form</h2>
            <form id="feedbackForm">
                <div class="form-group">
                    <label for="username">Full Name:</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="useremail">Email Address:</label>
                    <input type="email" id="useremail" name="useremail" class="form-input" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="userrole">Role:</label>
                    <select id="userrole" name="userrole" class="form-input">
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Are you enjoying the course?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="enjoy" value="yes" checked> Yes</label>
                        <label><input type="radio" name="enjoy" value="no"> No</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="comments">Comments / Feedback:</label>
                    <textarea id="comments" name="comments" class="form-input" rows="4" placeholder="Write your comments..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit Feedback</button>
            </form>
        </div>

    </div>

    <script>
      const scriptURL = 'https://script.google.com/macros/s/AKfycbxfoFVLtXgBdtrcYVxYDP4DamwfP9Mo3ZQmZ_sqGzzXrMeu-N5v3ccWEFh6gTWJjSDT/exec';
      const form = document.getElementById('feedbackForm');

      form.addEventListener('submit', e => {
        e.preventDefault();
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
          .then(response => {
             alert('Данные успешно отправлены в Google Таблицу!');
             form.reset();
          })
          .catch(error => console.error('Ошибка!', error.message));
      });
    </script>
</body>
</html>
